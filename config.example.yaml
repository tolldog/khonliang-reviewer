# khonliang-reviewer config — copy to config.yaml and edit locally.
# config.yaml is git-ignored; machine-specific paths and tokens go here.

# SQLite database for usage records + model pricing table.
db_path: data/reviewer.db

# Bus URL this agent registers with.
bus_url: http://localhost:8787

# Selector-layer default provider/model. Resolution order for
# `handle_review_text` / `handle_review_diff`: caller-supplied
# `(backend, model)` always wins; otherwise the rule table
# (`reviewer.rules.policy.decide()`) consults review kind + diff
# size + repo profile and returns an explicit `(backend, model)`
# pair, which is what the typical no-override review path uses; the
# fields below are the SelectorConfig fallback when neither caller
# nor rule-table produces an explicit model. Both the rule-table
# `DEFAULT_FALLBACK` and `SelectorConfig.default_model` track the
# `DEFAULT_REVIEWER_MODEL` constant in `reviewer/defaults.py`, so a
# single edit there flips both fallback paths in lockstep.
#
# `deepseek-coder-v2:16b` was promoted from `qwen2.5-coder:14b` on the
# 2026-04-30 speed sweep — 334 tok/s vs 94 tok/s on the same hardware
# (RTX 5080, MoE active path). Same VRAM tier (~8.9 GB).
default_provider: ollama
default_model: deepseek-coder-v2:16b
#
# Fast pre-push gate: small code diffs already land on the fast
# `default_model` above via the rule-table fallback. For a *large* diff
# that would otherwise escalate to Claude, pass `fast: true` on a
# `review_diff` / `review_text` call to force the fast resident local
# tier (`reviewer.rules.policy.FAST_TIER_MODEL`, aliased to the default
# above) — a quick local gate that trades review rigor for speed. It is
# scoped to `kind="pr_diff"` (spec/milestone reviews still reach Claude)
# and is inert when an explicit `backend`/`model` is supplied. NB: it
# forces the local tier but does not by itself make a large review fast —
# a big diff still gets a large context window and can be slow under GPU
# contention.

# Per-backend default models. Preferred over the legacy single-string
# `default_model` above: each backend ships its own sensible default so
# a caller asking for `claude_cli` without a model gets `sonnet` rather
# than the qwen-shaped global default. Empty-string entries mean
# "unset at the selector layer" — selection falls through to the
# legacy `default_model` (only if the chosen backend matches
# `default_provider`) or finally to the empty-string sentinel that
# tells providers to apply their own default. The legacy
# `default_model` field above stays valid for backward compat;
# operators with existing configs keep working without changes.
default_models:
  claude_cli: sonnet
  codex_cli: ""        # codex_cli picks its own default
  gh_copilot: ""       # gh_copilot picks its own default
  ollama: deepseek-coder-v2:16b

# Provider-specific configuration. Each provider is implemented in a later
# work unit; the keys below are placeholders documenting the eventual shape.
providers:
  ollama:
    base_url: http://localhost:11434/v1
  claude_cli:
    # `claude` binary must be on PATH and `CLAUDE_CODE_OAUTH_TOKEN` must be
    # provisioned per-machine via `claude setup-token`. See CLAUDE.md.
    binary: claude
